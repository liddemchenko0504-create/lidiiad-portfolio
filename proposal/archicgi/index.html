<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#09090a"><title>ArchiCGI · France Organic Growth Strategy</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090a;--paper:#141416;--paper2:#1b1b1e;--white:#f5f3ee;--muted:#9c9a9c;--rule:#333235;--accent:#f5f3ee}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font:400 16px/1.6 Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
::selection{background:#ffffff;color:#09090a}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px clamp(22px,5vw,90px);border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
header span:last-child{color:var(--muted)}
main{min-height:0}
#gate{max-width:1720px;margin:auto;padding:clamp(75px,11vw,165px) clamp(22px,5vw,90px) clamp(110px,12vw,170px);border-bottom:1px solid var(--rule)}
#gate .gate-inner{max-width:840px}
.lock{border:1px solid #555156;color:var(--accent);width:49px;height:49px;display:grid;place-items:center;font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:0 0 25px}
h1{font-size:clamp(65px,10.5vw,150px);font-weight:900;line-height:.93;letter-spacing:-.075em;margin:0 0 32px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:clamp(18px,2.15vw,27px);line-height:1.45;max-width:680px;margin:0 0 30px}
.small{font-size:12px;line-height:1.7;color:var(--muted)}
form{max-width:530px;margin-top:42px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;margin-bottom:12px;color:var(--accent)}
input{width:100%;padding:16px 18px;min-height:58px;border:1px solid #5b595a;background:var(--paper);font:500 16px Archivo,Arial,sans-serif;color:var(--white);border-radius:0}
button{display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;margin-top:12px;padding:17px 22px;min-height:57px;background:var(--white);border:1px solid var(--white);color:#09090a;font:800 12px Archivo,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}
button:hover{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:wait}
#error{color:#ffffff;font-size:13px;min-height:1.6em}
#report{display:none;max-width:1720px;margin:0 auto;padding:0 clamp(22px,5vw,90px) 110px}
#report section{padding:clamp(72px,8vw,130px) 0;border-bottom:1px solid var(--rule)}
#report section.intro{padding-top:clamp(80px,9vw,140px)}
#report h1,#report h2{font-size:clamp(43px,6vw,93px);font-weight:900;text-transform:uppercase;letter-spacing:-.064em;line-height:1.02;margin:0 0 25px}
#report h3{font-size:clamp(21px,2.2vw,34px);line-height:1.15;letter-spacing:-.045em;text-transform:uppercase;margin:0 0 15px;font-weight:800}
#report p{margin:0 0 18px;line-height:1.7;max-width:880px}
#report .intro p:first-child,#report .tag,#report .backlog span{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:var(--accent)}
#report .lead{font-size:clamp(18px,2vw,25px)}
#report .tiles,#report .markets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:32px}
#report .tiles>div,#report .markets article{background:var(--paper);border:1px solid #252427;padding:clamp(22px,2.5vw,35px);min-width:0}
#report .tiles b,#report .tiles span{display:block}
#report .tiles b{font-size:clamp(34px,4vw,60px);letter-spacing:-.06em;line-height:1.15;font-weight:900;color:var(--white)}
#report .tiles span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#report .markets article p{font-size:14px;color:#b6b4b4}
#report .volume{font-size:clamp(34px,4vw,60px);font-weight:900;letter-spacing:-.06em}
#report .volume small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
#report .finding,#report .backlog>div{border-top:1px solid var(--rule);padding:26px 0}
#report .finding>b,#report .backlog strong{font-size:20px;font-weight:800}
#report .finding p,#report .backlog p{margin:9px 0 0;color:#c7c4c1}
#report .note{background:var(--paper);border-left:3px solid var(--accent);padding:27px 30px;color:#c7c4c1;font-size:14px;line-height:1.7;margin-top:28px}
#report a{color:var(--accent)}
#report code{overflow-wrap:anywhere}
#report footer{display:flex;flex-wrap:wrap;gap:15px;justify-content:space-between;padding:25px 0;font-size:11px;color:var(--muted)}
@media(max-width:800px){header{padding:17px 20px;align-items:flex-start}header span:last-child{max-width:120px;text-align:right}#gate{padding:75px 20px 95px}h1{font-size:clamp(55px,13vw,95px)}#report{padding:0 20px 80px}#report .tiles,#report .markets{grid-template-columns:1fr}#report section{padding:65px 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* Ambient ArchiCGI film: blurred, muted, and purely decorative */
#gate{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;display:flex;align-items:center}
#gate .gate-inner{position:relative;z-index:2}
#gate .hero-film{position:absolute;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(115deg,#181719,#0b0b0c)}
#gate .hero-film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(9px) grayscale(1) brightness(.7);transform:scale(1.045);pointer-events:none}
#gate .hero-film::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,9,10,.92) 0%,rgba(9,9,10,.79) 48%,rgba(9,9,10,.53) 100%);z-index:1;pointer-events:none}
#gate .hero-film::before{content:"";position:absolute;inset:0;background:#09090a url("https://archicgi.com/wp-content/uploads/2026/03/waterfront-hotel-resort-exterior-3d-rendering-.webp") center/cover no-repeat;filter:blur(9px) grayscale(1);transform:scale(1.05)}
#gate .gate-inner{max-width:900px}#gate h1{text-shadow:0 3px 16px rgba(0,0,0,.34)}
@media(max-width:800px){#gate{min-height:100svh}#gate .hero-film video{filter:blur(6px) grayscale(1) brightness(.7)}#gate .hero-film::after{background:rgba(9,9,10,.82)}}
@media(prefers-reduced-motion:reduce){#gate .hero-film video{display:none}}

.hero-brand{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(22px,3.3vw,45px);margin-bottom:32px}
.hero-brand-logo{display:block;width:min(550px,83vw);height:auto;max-height:160px;object-fit:contain;object-position:left center}
.hero-brand h1{margin:0}
@media(max-width:800px){.hero-brand-logo{width:min(450px,85vw);max-height:125px}}
.prepared-for-logo{display:inline-flex;align-items:center;gap:16px;flex-wrap:wrap}.prepared-for-logo>span{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.prepared-for-logo img{display:block;max-width:min(220px,58vw);max-height:64px;width:auto;height:auto;object-fit:contain}

/* REPORT HERO: LIGHT EDITORIAL COUNTRY SELECTOR */
#report .proposal-hero{background:#f5f5f3;color:#101012;margin:0 calc(-1 * clamp(22px,5vw,90px));padding:36px clamp(22px,5vw,90px) 70px!important;border-bottom:1px solid #a4a4a3}
#report .proposal-hero .proposal-header{display:flex;align-items:center;padding-bottom:25px;border-bottom:1px solid #969696;margin-bottom:clamp(40px,5vw,65px)}
#report .proposal-logo{display:block;max-width:235px;width:35vw;height:auto;max-height:73px;object-fit:contain;object-position:left center;filter:brightness(0)}
#report .proposal-hero h1{color:#0d0d0f;font-size:clamp(44px,6.3vw,102px);line-height:.98;margin:0 0 22px;max-width:1160px;letter-spacing:-.072em}
#report .proposal-hero p,#report .proposal-hero .lead{color:#4d4d4d!important;font-size:clamp(16px,1.5vw,21px);line-height:1.65;max-width:850px;text-transform:none;letter-spacing:normal;font-weight:400}
#report .country-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:36px}
#report .country-card{isolation:isolate;display:flex;position:relative;flex-direction:column;align-items:flex-start;justify-content:center;min-height:245px;padding:clamp(20px,3vw,38px);overflow:hidden;text-decoration:none!important;background:#e8e8e8;border:0;color:#111!important;transition:transform .2s ease}
#report .country-card::before{content:"";position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;filter:grayscale(1)}
#report .country-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(247,247,247,.94) 0%,rgba(247,247,247,.70) 52%,rgba(247,247,247,.10) 100%)}
#report .country-card--fr::before{background-image:url('/assets/architectural-rendering-chalet-lounge-interior.png');background-position:58% center}
#report .country-card--es::before{background:linear-gradient(151deg,transparent 32%,#8f8f8f 32% 36%,transparent 36%),linear-gradient(25deg,#e9e9e9 0 38%,#b1b1b1 38% 54%,#f0f0f0 54% 100%)}
#report .country-card--it::before{background:radial-gradient(ellipse 36% 90% at 76% 113%,#858585 0 52%,transparent 53%),linear-gradient(118deg,#ededed 0 32%,#bababa 32% 42%,#f0f0f0 42% 100%)}
#report .country-card strong{display:block;font-size:clamp(27px,3vw,48px);font-weight:900;letter-spacing:-.055em;line-height:1;text-transform:uppercase;position:relative}
@media (hover:hover) and (pointer:fine){#report .country-card:hover{transform:translateY(-4px);outline:2px solid #111;outline-offset:3px}}
#report .country-card:focus-visible{transform:translateY(-4px);outline:3px solid #111;outline-offset:3px}
@media (hover:none){#report .country-card:hover:not(:focus-visible){transform:none;outline:none}}
#report .proposal-hero .proposal-description{margin:0}
@media(max-width:800px){#report .proposal-hero{margin:0 -20px;padding:24px 20px 45px!important}#report .country-cards{grid-template-columns:1fr;gap:10px}#report .country-card{min-height:160px}#report .proposal-logo{width:190px}#report .proposal-hero .proposal-header{margin-bottom:39px}}

/* Responsive proposal hero photography: desktop and mobile source files in /assets. */
#report .proposal-hero{padding:0 clamp(22px,5vw,90px) 70px!important}
#report .proposal-hero-visual{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;
  min-height:clamp(570px,53vw,750px);

}

#report .proposal-hero-visual::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;

#report .proposal-hero-visual .proposal-description{max-width:590px;color:#282625!important;line-height:1.55}
#report .proposal-hero .country-cards{margin-top:32px}
@media(max-width:800px){
  #report .proposal-hero{margin:0 -20px;padding:0 20px 45px!important}

    margin:0 -20px;padding:26px 20px 36px;

  }
  #report .proposal-hero-visual::before{
    background:linear-gradient(180deg,rgba(250,246,240,.57) 0%,rgba(250,246,240,.24) 40%,rgba(250,246,240,0) 67%);
  }
  #report .proposal-hero-visual .proposal-header{margin-bottom:clamp(33px,8vw,52px)}
  #report .proposal-hero-visual .proposal-copy{max-width:100%}
  #report .proposal-hero-visual h1{font-size:clamp(41px,10vw,62px);letter-spacing:-.072em;margin-bottom:22px}
  #report .proposal-hero-visual .proposal-description{max-width:350px;font-size:clamp(15px,3.8vw,18px);line-height:1.5}

/* 01 / EXECUTIVE PERSPECTIVE — consistent with existing monochrome ArchiCGI report */
#report section.business-opportunity{
  --bo-ink:var(--white);--bo-muted:var(--muted);--bo-line:var(--rule);
  --bo-paper:var(--paper);
  background:transparent;color:var(--bo-ink);
  margin:0;
  padding:clamp(72px,8vw,130px) 0!important;
  border-bottom:1px solid var(--rule);
}
#report .business-opportunity .bo-kicker{
  display:flex;align-items:center;gap:14px;margin:0 0 clamp(32px,4.5vw,64px);
  color:var(--white);font:800 11px/1.5 Archivo,Arial,sans-serif;
  letter-spacing:.18em;text-transform:uppercase
}
#report .business-opportunity .bo-kicker-number{
  font:800 12px/1.5 Archivo,Arial,sans-serif;letter-spacing:.14em;color:var(--white)
}
#report .business-opportunity .bo-kicker-rule{flex:1;height:1px;background:var(--rule);max-width:170px}
#report .business-opportunity .bo-intro{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  column-gap:clamp(38px,6vw,110px);align-items:start;
  padding-bottom:clamp(45px,5vw,84px)
}
#report .business-opportunity h2{
  font:900 clamp(43px,6vw,93px)/1.02 Archivo,Arial,sans-serif;
  letter-spacing:-.064em;text-transform:uppercase;color:var(--white);
  margin:0 0 24px;max-width:800px
}
#report .business-opportunity h2 em{
  display:block;font:inherit;font-style:normal;color:var(--white)
}
#report .business-opportunity .bo-deck{
  font:500 clamp(18px,2vw,25px)/1.45 Archivo,Arial,sans-serif;
  letter-spacing:-.02em;color:var(--white);max-width:640px;margin:0
}
#report .business-opportunity .bo-intro-copy{padding-top:7px}
#report .business-opportunity .bo-intro-copy p{
  font-size:clamp(15px,1.25vw,18px);line-height:1.75;color:#c7c4c1;
  margin:0 0 23px;max-width:680px
}
#report .business-opportunity .bo-thesis{
  display:grid;grid-template-columns:minmax(115px,.22fr) 1fr;
  gap:clamp(20px,4vw,60px);padding:32px 0 40px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  align-items:start
}
#report .business-opportunity .bo-side-label{
  font:800 11px/1.6 Archivo,Arial,sans-serif;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted)
}
#report .business-opportunity .bo-thesis p{
  font:600 clamp(24px,2.9vw,42px)/1.22 Archivo,Arial,sans-serif;
  letter-spacing:-.045em;color:var(--white);
  margin:0;max-width:1050px
}
#report .business-opportunity .bo-thesis strong{font-weight:700}
#report .business-opportunity .bo-levers-header{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  margin:clamp(52px,6vw,88px) 0 22px
}
#report .business-opportunity .bo-levers-header h3{
  font:800 clamp(16px,1.6vw,22px)/1.3 Archivo,Arial,sans-serif;
  letter-spacing:-.02em;text-transform:uppercase;color:var(--white);margin:0
}
#report .business-opportunity .bo-levers-header span{
  font:700 11px/1.5 Archivo,Arial,sans-serif;
  letter-spacing:.12em;color:var(--muted)
}
#report .business-opportunity .bo-levers{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)
}
#report .business-opportunity .bo-lever{
  padding:clamp(24px,3vw,42px) clamp(14px,2.4vw,35px) clamp(35px,4vw,58px);
  min-width:0
}
#report .business-opportunity .bo-lever:first-child{padding-left:0}
#report .business-opportunity .bo-lever:last-child{padding-right:0}
#report .business-opportunity .bo-lever+.bo-lever{border-left:1px solid var(--rule)}
#report .business-opportunity .bo-lever-index{
  display:block;margin-bottom:clamp(25px,3vw,43px);
  font:900 clamp(32px,4vw,58px)/1 Archivo,Arial,sans-serif;
  letter-spacing:-.06em;color:#777579
}
#report .business-opportunity .bo-lever h4{
  font:800 clamp(20px,1.9vw,27px)/1.2 Archivo,Arial,sans-serif;
  letter-spacing:-.045em;text-transform:uppercase;color:var(--white);
  margin:0 0 18px;max-width:360px

#report .business-opportunity .bo-lever-visual{display:block;width:100%;margin:22px 0 24px;padding:0;border:0;background:transparent;overflow:hidden}
#report .business-opportunity .bo-lever-visual img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;mix-blend-mode:lighten;background:transparent}
#report .business-opportunity .bo-lever p{
  font-size:clamp(14px,1.14vw,16px);line-height:1.7;
  color:#b6b4b4;margin:0
}
#report .business-opportunity .bo-outcome{

  margin-top:clamp(58px,7vw,104px);padding:clamp(26px,4vw,61px);

#report .business-opportunity .bo-outcome .bo-side-label{color:var(--muted)}

#report .business-opportunity .bo-outcome h3 em{

}
#report .business-opportunity .bo-outcome-intro{

#report .business-opportunity .bo-outcome-subhead{

#report .business-opportunity .bo-method{

 <section class="frx-section" id="fr-overview">

function cleanResearchPresentation(root){
 const logo='/assets/bfc9f7d1-1d7f-4ffc-8612-e29fc8500981.png';
 const removeExact=[/^INDEPENDENT RESEARCH\s*[·•-]\s*21 NOVEMBER 2026$/i,/^Prepared by Lidiia Demchenko\s*[·•-]\s*Public-source research only\s*[·•-]\s*No access to Google Search Console or GA4$/i,/^P[1-3]\s*[·•-]\s*.+$/i];
 // Edit only individual text nodes, preserving surrounding report content.
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const raw=node.nodeValue||'',trimmed=raw.trim();
  if(!trimmed)continue;
  if(removeExact.some(rx=>rx.test(trimmed))){node.nodeValue='';continue;}
  if(/^0[1-9]\s*(?:\/|—|–|·)\s*$/.test(trimmed)){node.nodeValue='';continue;}
  if(/^PREPARED FOR\s+ARCHICGI\s+REVIEW$/i.test(trimmed)){
   const wrap=document.createElement('span');wrap.className='prepared-for-logo';
   const caption=document.createElement('span');caption.textContent='PREPARED FOR';
   const img=document.createElement('img');img.src=logo;img.alt='ArchiCGI';img.loading='lazy';
   wrap.append(caption,img);node.replaceWith(wrap);continue;
  }
  let updated=raw
   .replace(/INDEPENDENT RESEARCH\s*[·•-]\s*21 NOVEMBER 2026/gi,'')
   .replace(/Prepared by Lidiia Demchenko\s*[·•-]\s*Public-source research only\s*[·•-]\s*No access to Google Search Console or GA4/gi,'')
   .replace(/\b0[1-9]\s*\/\s*(?=[A-Za-z])/g,'')
   .replace(/\bP[1-3]\s*[·•-]\s*(?:VALIDATE|AUDIT|REVIEW|OPTIMIZE|IMPLEMENT|TEST|MONITOR|MEASURE)\b/gi,'');
  if(updated!==raw)node.nodeValue=updated;
 }
 // Remove blank presentation-only labels without disturbing cards/sections.
 for(const el of [...root.querySelectorAll('span,p,small,div')]){
  if(el.children.length===0&&!el.textContent.trim()&&el.className!=='')el.remove();
 }
}

/* Click-to-enlarge for ChatGPT screenshots. Delegated to support the unlocked report. */
(function(){
 let returnFocus=null;
 function getDialog(){
  let dialog=document.getElementById('frx-screenshot-dialog');
  if(dialog)return dialog;
  dialog=document.createElement('dialog');
  dialog.id='frx-screenshot-dialog';
  dialog.className='frx-screenshot-dialog';
  dialog.setAttribute('aria-label','ChatGPT screenshot viewer');
  dialog.innerHTML='<div class="frx-lightbox-top"><button class="frx-lightbox-close" type="button" aria-label="Close screenshot">CLOSE</button></div><img class="frx-lightbox-img" alt="">';
  document.body.appendChild(dialog);
  dialog.querySelector('.frx-lightbox-close').addEventListener('click',function(){dialog.close()});
  dialog.addEventListener('click',function(event){if(event.target===dialog)dialog.close()});
  dialog.addEventListener('close',function(){if(returnFocus&&returnFocus.isConnected)returnFocus.focus();returnFocus=null});
  return dialog;
 }
 document.addEventListener('click',function(event){
  const link=event.target.closest&&event.target.closest('#report a.frx-prompt-image');
  if(!link)return;
  event.preventDefault();
  const dialog=getDialog();
  const image=dialog.querySelector('.frx-lightbox-img');
  image.src=link.getAttribute('href');
  image.alt=link.querySelector('img')?.alt||'ChatGPT screenshot';
  returnFocus=link;
  if(!dialog.open)dialog.showModal();
 });
})();


(function(){const root=document.querySelector('#fr-ai .frx-discovery-carousel');if(!root)return;const slides=[...root.querySelectorAll('.frx-discovery-slide')],labels=["Expert-reviewed French service Q&A","Project-backed examples with source detail","Googlebot & OAI-SearchBot access review","12-prompt visibility & citation benchmark"];const count=root.querySelector('.frx-discovery-count'),caption=root.querySelector('.frx-discovery-caption');let index=0,startX=null;function show(next){index=(next+slides.length)%slides.length;slides.forEach((slide,i)=>{slide.classList.toggle('is-active',i===index);slide.setAttribute('aria-hidden',String(i!==index))});count.textContent=String(index+1).padStart(2,'0')+' / 04';caption.textContent=labels[index]}root.querySelector('.frx-discovery-prev').addEventListener('click',()=>show(index-1));root.querySelector('.frx-discovery-next').addEventListener('click',()=>show(index+1));const stage=root.querySelector('.frx-discovery-stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)show(index+(dx<0?1:-1));startX=null},{passive:true})})();
