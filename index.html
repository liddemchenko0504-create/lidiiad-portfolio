<title>Lidiia Demchenko — E-commerce & Brand Portfolio</title>
<meta name="description" content="Selected e-commerce, merchandising and creative operations work across ODDITY Tech brands IL MAKIAGE and SpoiledChild.">

<style>
:root{--bg:#0b0b0c;--ink:#f1f1ec;--blue:#4a5bff;--wine:#961d28}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Archivo,Arial,sans-serif}
a{color:inherit}a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.ui-arrow{width:19px;height:19px;display:inline-block;vertical-align:middle;flex-shrink:0}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(16px,3vw,42px);border-bottom:3px solid var(--ink);background:var(--bg);font-size:14px;font-weight:900}
nav a{text-decoration:none}nav .navlinks{display:flex;align-items:center;gap:clamp(11px,3vw,32px);flex-wrap:wrap}
nav a:hover{color:#bac1ff}
.intro{padding:clamp(45px,8vw,115px) clamp(17px,4vw,65px);min-height:45svh;display:flex;flex-direction:column;justify-content:space-between;gap:45px;border-bottom:3px solid var(--ink);background:radial-gradient(circle at 88% 22%,#59152e,transparent 42%),var(--bg)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#f2b2c3}
.intro h1,.brand-work h2,.brand-work h3,.contact-teaser h2{margin:0;text-transform:uppercase;font-weight:900;line-height:.88;letter-spacing:-.055em}
.intro h1{font-size:clamp(48px,10.8vw,180px);overflow-wrap:break-word}
.intro p{max-width:670px;font-size:clamp(19px,2.2vw,31px);line-height:1.27;margin:0}
.brand-work>h2{font-size:clamp(50px,9vw,135px);padding:clamp(22px,3vw,42px);border-bottom:3px solid var(--ink)}
.brand-work__intro{display:flex;align-items:end;justify-content:space-between;gap:25px;padding:clamp(19px,3vw,43px);border-bottom:3px solid var(--ink)}
.brand-work__intro span{font-size:12px;letter-spacing:.1em;font-weight:900}
.brand-work__intro p{font-size:clamp(18px,2vw,28px);max-width:560px;line-height:1.25;margin:0}
.brand-work__grid{display:grid;grid-template-columns:1fr 1fr}
.brand-work__card{display:flex;flex-direction:column;min-width:0}
.brand-work__card:first-child{border-right:3px solid var(--ink)}
.brand-work__visual{background:#171719;overflow:hidden}
.brand-work__visual img{display:block;width:100%;height:clamp(300px,37vw,610px);object-fit:cover;object-position:center}
.brand-work__card--ilm .brand-work__visual img{object-position:right center}
.brand-work__card--spoiled .brand-work__visual{background:#004a20}
.brand-work__card--spoiled .brand-work__visual img{object-fit:cover}
.brand-work__body{padding:clamp(22px,3.5vw,54px);display:flex;flex-direction:column;align-items:flex-start;flex:1;min-height:330px}
.brand-work__eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;color:#f4a8be}
.brand-work__body h3{font-size:clamp(54px,7vw,115px);margin:24px 0;line-height:.83}
.brand-work__body p{font-size:clamp(17px,1.7vw,23px);line-height:1.35;max-width:430px;margin:0 0 28px}
.brand-work__cta{margin-top:auto;display:inline-flex;align-items:center;justify-content:space-between;gap:17px;font-size:13px;font-weight:900;text-decoration:none;padding:13px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);box-shadow:5px 5px 0 var(--blue);transition:background .2s,color .2s,box-shadow .2s,transform .25s}
.brand-work__cta:hover,.brand-work__cta:focus-visible{background:var(--blue);color:white;border-color:var(--blue);transform:translateY(-5px);box-shadow:8px 8px 0 var(--wine)}
.contact-teaser{border-top:3px solid var(--ink);padding:clamp(35px,5vw,75px) clamp(18px,4vw,65px);display:flex;justify-content:space-between;align-items:center;gap:28px}
.contact-teaser h2{font-size:clamp(45px,7vw,105px)}
.contact-teaser a{display:inline-flex;gap:12px;align-items:center;text-decoration:none;font-size:14px;font-weight:900;border-bottom:2px solid var(--ink);padding-bottom:8px}
.contact-teaser a:hover{color:#c2c5ff}
footer{padding:18px clamp(18px,4vw,65px);border-top:3px solid var(--ink);font-size:13px;font-weight:800}
@media(max-width:800px){
 .intro{min-height:38svh;gap:35px}
 .brand-work__intro{display:block}.brand-work__intro p{margin-top:12px}
 .brand-work__grid{grid-template-columns:1fr}
 .brand-work__card:first-child{border-right:0;border-bottom:3px solid var(--ink)}
 /* Mobile: natural image dimensions, no object-fit crop or fixed height. */
 .brand-work__visual img,.brand-work__card--ilm .brand-work__visual img,.brand-work__card--spoiled .brand-work__visual img{width:100%;height:auto;object-fit:contain;object-position:center;max-height:none}
 .brand-work__body{min-height:245px}
 .brand-work__body h3{font-size:clamp(54px,12vw,90px)}
 .contact-teaser{display:block}.contact-teaser a{margin-top:25px}
}
@media(max-width:420px){.intro h1{font-size:clamp(43px,11vw,65px)}.brand-work__body h3{font-size:clamp(51px,12vw,72px)}nav{font-size:13px;padding:13px 15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ODDITY Tech work banner placed above both brand collections. */
.brand-work__banner{width:100%;border-bottom:3px solid var(--ink);overflow:hidden;background:#171719}
.brand-work__banner img{display:block;width:100%;height:auto;object-fit:contain;object-position:center}
@media(max-width:800px){.brand-work__banner img{width:100%;height:auto;max-height:none;object-fit:contain}}
.site-logo{display:inline-flex!important;align-items:center;flex:0 0 auto;line-height:0;text-decoration:none!important;margin:0!important}.site-logo img{display:block;width:clamp(120px,16vw,210px);max-width:100%;height:auto;object-fit:contain}nav{align-items:center;gap:12px}@media(max-width:650px){nav{flex-wrap:wrap;gap:8px;padding-left:12px;padding-right:12px}.site-logo img{width:120px}nav .navlinks{gap:10px;justify-content:flex-end;min-width:0}nav a{margin-left:0}}

/* ODDITY WORK — a continuous dark editorial section, no white divider bands */
.brand-work>h2{border-bottom:0;padding-bottom:0}
.brand-work__banner{border-bottom:0;background:#020817;line-height:0}
.brand-work__banner img{display:block;width:100%;height:auto;max-height:none;object-fit:contain}
.brand-work__intro{justify-content:flex-end;border-bottom:0;padding-top:clamp(6px,1.2vw,16px);padding-bottom:clamp(22px,3vw,42px)}
.brand-work__intro p{max-width:660px}
.brand-work__body h3{margin-top:12px}
.contact-teaser a.contact-teaser__cta{margin-top:0;display:inline-flex;gap:17px;align-items:center;justify-content:space-between;padding:13px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-size:13px;font-weight:900;text-decoration:none;box-shadow:5px 5px 0 var(--blue);transition:background .2s,color .2s,transform .25s,box-shadow .2s;white-space:nowrap}
.contact-teaser a.contact-teaser__cta:hover,.contact-teaser a.contact-teaser__cta:focus-visible{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-5px);box-shadow:8px 8px 0 var(--wine)}
@media(max-width:800px){.brand-work__banner img{width:100%;height:auto;object-fit:contain}.brand-work__intro{padding-top:8px}.contact-teaser a.contact-teaser__cta{margin-top:24px}}
@media(prefers-reduced-motion:reduce){.contact-teaser a.contact-teaser__cta{transition:none!important}.contact-teaser a.contact-teaser__cta:hover{transform:none!important}}

/* Editorial photography homepage hero, photo retains natural proportions */
.intro-beauty{position:relative;display:block;min-height:0;padding:0;overflow:hidden;background:#070707;border-bottom:3px solid var(--ink)}
.intro-beauty__photo{display:block;width:100%;height:auto;max-height:none;object-fit:contain;filter:none}
.intro-beauty__copy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:20px;padding:clamp(18px,3.8vw,65px);background:linear-gradient(90deg,rgba(0,0,0,.38),transparent 67%);pointer-events:none}
.intro-beauty__roles{font-size:clamp(10px,.95vw,14px)!important;font-weight:900;line-height:1.5!important;letter-spacing:.09em;max-width:560px!important;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px #000a}
.intro-beauty h1{font-size:clamp(75px,17vw,280px);letter-spacing:-.08em;line-height:.82;white-space:nowrap;color:#fff;text-shadow:0 3px 22px #0005}
.intro-beauty__period{color:#fff}
@media(max-width:800px){
.intro-beauty__photo{width:100%;height:auto;max-height:none;object-fit:contain}
.intro-beauty__copy{position:static;padding:25px 18px 30px;background:#09090a;gap:25px}
.intro-beauty__roles{font-size:11px!important;letter-spacing:.07em}
.intro-beauty h1{font-size:clamp(65px,17vw,150px);letter-spacing:-.075em}
}

/* CONTACT-INSPIRED MINIMAL EDITORIAL SYSTEM */
:root{--bg:#0b0b0c;--ink:#f1f1ec}
nav{border-bottom:1px solid #ffffff3c}
.intro:not(.intro-beauty){background:var(--bg);border-bottom:1px solid #ffffff3c}
.intro-beauty{border-bottom:1px solid #ffffff3c}
.intro-beauty__copy{background:none}
.brand-work>h2{border-bottom:0;padding-bottom:12px}
.brand-work__banner{background:#0b0b0c}
.brand-work__intro{border-bottom:1px solid #ffffff3c}
.brand-work__card:first-child{border-right:1px solid #ffffff3c}
.brand-work__body{min-height:285px}
.brand-work__eyebrow{color:#aaaab0}
.brand-work__cta,.contact-teaser a.contact-teaser__cta{box-shadow:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .18s,color .18s,border-color .18s}
.brand-work__cta:hover,.brand-work__cta:focus-visible,.contact-teaser a.contact-teaser__cta:hover,.contact-teaser a.contact-teaser__cta:focus-visible{box-shadow:none;transform:none;background:var(--blue);border-color:var(--blue);color:#fff}
.contact-teaser{border-top:1px solid #ffffff3c}
footer{border-top:1px solid #ffffff3c}
@media(max-width:800px){.brand-work__card:first-child{border-right:0;border-bottom:1px solid #ffffff3c}.brand-work__body{min-height:230px}}


/* CONSISTENT GLOBAL NAVIGATION */
nav{font-family:Archivo,Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:.015em}
nav .navlinks{display:flex;align-items:center;justify-content:flex-end;gap:clamp(12px,2.5vw,28px);flex-wrap:wrap}
nav .navlinks a{font:inherit;text-transform:uppercase;text-decoration:none}
@media(max-width:650px){nav{font-size:12px}nav .navlinks{gap:12px}}

/* IL MAKIAGE product banner on home — natural composition, no text overlays */
.brand-work__card--ilm .brand-work__visual{background:#161416}
.brand-work__card--ilm .brand-work__visual img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center;filter:none}

/* Home Work: concise heading, without ODDITY artwork */
.brand-work>h2{font-size:clamp(43px,7.4vw,115px);line-height:.94;letter-spacing:-.055em;text-transform:uppercase;padding:clamp(36px,5vw,75px) clamp(20px,5vw,82px);margin:0;border-bottom:1px solid #ffffff3c}
@media(max-width:800px){
  .intro-beauty h1{display:none}
  .intro-beauty__copy{padding:20px 18px;gap:0}
  .brand-work>h2{font-size:clamp(40px,9.2vw,73px);padding:36px 18px}
}

/* Desktop Work cards: show full campaign banners, never crop original compositions */
@media(min-width:801px){.brand-work__visual img,.brand-work__card--ilm .brand-work__visual img,.brand-work__card--spoiled .brand-work__visual img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center}}

/* Active Work navigation when viewing the homepage work section */
body:has(#work:target) .navlinks a[href="#work"]{color:#b8c0ff}
